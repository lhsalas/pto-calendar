services:
  db:
    image: postgres:16-alpine
    container_name: pto-calendar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pto
      POSTGRES_PASSWORD: pto
      POSTGRES_DB: pto
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pto_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U pto -d pto
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pto_pgdata:
