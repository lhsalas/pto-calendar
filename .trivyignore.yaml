  - id: CVE-2026-103111
    paths:
      - 'nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de (alpine 3.23.4)'
    expired_at: 2027-01-31
    statement: >-
      The advisory is in a package on the nginx image that is not on the request-serving path. In production nginx serves plain HTTP on the internal Docker network and Caddy terminates TLS, so its OpenSSL, curl, expat, libxml2, libuuid, pcre2, tiff and c-ares packages are not used to handle requests. The pinned digest is the newest published build.

  - id: CVE-2026-111943
    paths:
      - 'usr/bin/caddy'
    expired_at: 2027-01-31
    statement: >-
      The remaining Go standard library and golang.org/x/net advisories in the Caddy binary are denial-of-service issues in the HTTP/2 and TLS stacks. The pinned digest is the newest published build; the fix requires an upstream Caddy rebuild. Caddy only terminates TLS for the application and is not exposed to untrusted HTTP/2 traffic.

