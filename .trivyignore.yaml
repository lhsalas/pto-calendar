  - id: CVE-2026-27135
    paths:
      - 'nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de (alpine 3.23.4)'
    expired_at: 2027-01-31
    statement: >-
      The advisory is in the HTTP/2 library of the nginx image. The production nginx configuration listens on plain HTTP without the http2 directive, so HTTP/2 is never negotiated on the hop from Caddy and the library is not used. The pinned digest is the newest published build.

