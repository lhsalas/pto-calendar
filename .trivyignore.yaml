# Trivy exceptions for the pinned production images.
#
# Every entry names the advisory, the exposure assessment, the owner and an
# expiry date. The pipeline fails on any high or critical finding that is
# not listed here, and it fails on an expired entry, so this list cannot rot.
#
# Regenerate the candidate list with:
#   node infra/security/generate-trivy-exceptions.mjs
#
# Owner: the repository maintainers.

vulnerabilities:
  - id: CVE-2025-61726
    paths:
      - 'usr/local/bin/gosu'
    expired_at: 2027-01-31
    statement: >-
      gosu is a startup-only privilege-drop helper in the PostgreSQL image. It performs no network I/O and is not the database process, so the Go standard library advisories in it are not reachable from the network. The image is pinned to the newest published build.

  - id: CVE-2025-61729
