  - id: CVE-2026-102276
    paths:
      - 'Node.js'
    expired_at: 2027-01-31
    statement: >-
      These are copies of brace-expansion and undici bundled inside the Node.js distribution. They are used by the bundled package manager and the build tooling, not by the served application, which only runs the compiled backend and serves prebuilt static files.

  - id: CVE-2026-102278
