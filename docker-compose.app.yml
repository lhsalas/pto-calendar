name: pto-calendar-app

services:
  db:
    image: postgres:16-alpine
    container_name: pto-calendar-app-db
    environment:
      POSTGRES_USER: pto
      POSTGRES_PASSWORD: pto
      POSTGRES_DB: pto
    volumes:
      - pto_pgdata_app:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U pto -d pto
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command:
      - sh
      - -c
      - 'npx prisma migrate deploy --schema=backend/prisma/schema.prisma && npx tsx backend/prisma/seed.ts && npx tsx backend/prisma/seedHolidays.ts --all'
    environment:
      DATABASE_URL: postgresql://pto:pto@db:5432/pto?schema=public
      BCRYPT_ROUNDS: '10'
      # seedHolidays -> HolidayService -> prisma.ts -> loadEnv() runs the
      # full backend env validator (SESSION_SECRET, COOKIE_SECURE,
      # BCRYPT_ROUNDS, etc.) before the chain reaches `new PrismaClient()`.
      # The migrate container never serves HTTP; these vars are present
      # purely to satisfy validation. They mirror the backend service so
      # dev parity is obvious.
      SESSION_SECRET: pto-calendar-dev-session-secret-at-least-32-chars-long
      COOKIE_SECURE: 'true'
      INSECURE_COOKIES_ALLOWED: 'true'
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: production
      PORT: '3000'
      DATABASE_URL: postgresql://pto:pto@db:5432/pto?schema=public
      SESSION_SECRET: pto-calendar-dev-session-secret-at-least-32-chars-long
      COOKIE_SECURE: 'false'
      # All-in-one demo compose is HTTP-only (no Caddy / TLS termination),
      # so COOKIE_SECURE=false is required for the session cookie to flow.
      # INSECURE_COOKIES_ALLOWED is the explicit, loud opt-out that bypasses
      # the production COOKIE_SECURE=true guard. Do NOT use this in a real
      # production deployment. See backend/.env.example for the warning text.
      INSECURE_COOKIES_ALLOWED: 'true'
      COOKIE_DOMAIN: ''
      CORS_ORIGIN: http://localhost:5173
      BCRYPT_ROUNDS: '10'
      LOG_LEVEL: info
      RATE_LIMIT_MAX: '100'
      AUTH_RATE_LIMIT_MAX: '5'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - '5173:80'
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pto_pgdata_app:
