name: pto-calendar-app

services:
  db:
    image: postgres:16-alpine
    container_name: pto-calendar-app-db
    environment:
      POSTGRES_USER: pto
      POSTGRES_PASSWORD: pto
      POSTGRES_DB: pto
    volumes:
      - pto_pgdata_app:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U pto -d pto
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: build
    command:
      - sh
      - -c
      - 'npx prisma migrate deploy --config=backend/prisma.config.ts && npx tsx backend/prisma/seed.ts && npx tsx backend/prisma/seedHolidays.ts --all'
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://pto:pto@db:5432/pto?schema=public
      BCRYPT_ROUNDS: '10'
      SESSION_SECRET: pto-calendar-dev-session-secret-at-least-32-chars-long
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: development
      PORT: '3000'
      DATABASE_URL: postgresql://pto:pto@db:5432/pto?schema=public
      SESSION_SECRET: pto-calendar-dev-session-secret-at-least-32-chars-long
      COOKIE_SECURE: 'false'
      # All-in-one demo compose is HTTP-only (no Caddy / TLS termination),
      # so COOKIE_SECURE=false is required for the session cookie to flow.
      COOKIE_DOMAIN: ''
      CORS_ORIGIN: http://localhost:5173
      BCRYPT_ROUNDS: '10'
      LOG_LEVEL: info
      # Every limiter value can be overridden from the operator environment.
      # The defaults stay conservative: the shared address high-water is the
      # emergency cap, and an office behind one address needs a higher
      # RATE_LIMIT_MAX before the per-caller budgets can help.
      RATE_LIMIT_MAX: '${RATE_LIMIT_MAX:-100}'
      AUTH_RATE_LIMIT_MAX: '${AUTH_RATE_LIMIT_MAX:-5}'
      RATE_LIMIT_ATTEMPT_WINDOW_MS: '${RATE_LIMIT_ATTEMPT_WINDOW_MS:-900000}'
      RATE_LIMIT_BEARER_FAILURE_MAX: '${RATE_LIMIT_BEARER_FAILURE_MAX:-20}'
      RATE_LIMIT_QUOTA_WINDOW_MS: '${RATE_LIMIT_QUOTA_WINDOW_MS:-60000}'
      RATE_LIMIT_USER_QUOTA_MAX: '${RATE_LIMIT_USER_QUOTA_MAX:-600}'
      RATE_LIMIT_TOKEN_QUOTA_MAX: '${RATE_LIMIT_TOKEN_QUOTA_MAX:-300}'
      RATE_LIMIT_TOKEN_ISSUANCE_MAX: '${RATE_LIMIT_TOKEN_ISSUANCE_MAX:-20}'
      RATE_LIMIT_TOKEN_PASSWORD_MAX: '${RATE_LIMIT_TOKEN_PASSWORD_MAX:-20}'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - '127.0.0.1:5173:80'
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pto_pgdata_app:
