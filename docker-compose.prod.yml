name: pto-calendar-prod

# Production topology: Caddy (TLS termination, HSTS) -> nginx (static SPA +
# /auth + /pto + /health + /ready proxy) -> backend (Express + Prisma) ->
# postgres.
#
# HOST, ACME_EMAIL, SESSION_SECRET, and CORS_ORIGIN are required at deploy
# time. The first `docker compose up` will fail if any is missing.

services:
  db:
    image: postgres:16-alpine
    container_name: pto-calendar-db-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: pto
      POSTGRES_PASSWORD: pto
      POSTGRES_DB: pto
    volumes:
      - pto_pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U pto -d pto
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  migrate:
    image: node:20-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://pto:pto@db:5432/pto?schema=public
    working_dir: /app
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    command: sh -c "npm ci --no-audit --no-fund && npx prisma migrate deploy"
    networks:
      - internal

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: pto-calendar-backend-prod
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://pto:pto@db:5432/pto?schema=public
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      COOKIE_SECURE: 'true'
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      BCRYPT_ROUNDS: '12'
      LOG_LEVEL: info
      TRUST_PROXY_HOPS: '2'
      AUTH_USER_CACHE_TTL_MS: '15000'
    networks:
      - internal

  frontend-build:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: pto-calendar-frontend-build-prod
    depends_on:
      - backend
    command: ['true']
    volumes:
      - frontend_dist:/out
    networks:
      - internal

  nginx:
    image: nginx:alpine
    container_name: pto-calendar-nginx-prod
    depends_on:
      - backend
      - frontend-build
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_dist:/usr/share/nginx/html:ro
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    container_name: pto-calendar-caddy-prod
    depends_on:
      - nginx
    ports:
      - '80:80'
      - '443:443'
    environment:
      HOST: ${HOST:?HOST is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal

volumes:
  pto_pgdata_prod:
  backend_node_modules:
  frontend_dist:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
