map $http_x_forwarded_proto $upstream_forwarded_proto {
  default $http_x_forwarded_proto;
  '' $scheme;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Static and proxy-response headers for the local all-in-one and OCI stacks.
  # Firebase uses the equivalent policy from firebase.json; helmet() covers
  # the API. CSP hash below is the base64 SHA-256 of the inline theme-init
  # script in
  # frontend/index.html (compute with:
  #   printf '%s' "<script>...</script>" | openssl dgst -sha256 -binary | base64
  # ). script-src does NOT use 'unsafe-inline'.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-SHJBvKlfSMRvNsEa24Mn3AXIWJ9hqNP04VpSScxpKXU='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header X-Frame-Options "DENY" always;
  # HSTS is configured by Caddy in the OCI production stack. nginx must not
  # duplicate it.

  location ~ ^/auth(/|$) {
    proxy_pass http://backend:3000$uri$is_args$args;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
  }

  location ~ ^/pto(/|$) {
    proxy_pass http://backend:3000$uri$is_args$args;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
  }

  location ~ ^/holidays(/|$) {
    proxy_pass http://backend:3000$uri$is_args$args;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
  }

  location ~ ^/users(/|$) {
    proxy_pass http://backend:3000$uri$is_args$args;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
  }

  location = /health {
    proxy_pass http://backend:3000/health;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
  }

  location = /ready {
    proxy_pass http://backend:3000/ready;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
  }

  location / {
    try_files $uri /index.html;
  }
}
