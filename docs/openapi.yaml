                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/PatForbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      security:
        - cookieAuth: []
        - personalToken: []
      summary: Create PTO entry for current user
      tags: [PTO]
      description: |
        PATs require pto:create AND PAT_WRITES_ENABLED. Always create for the
        credential owner, never a client-selected owner/role. A write scope
        does not grant note-read: the response note is null unless the token
        also has pto:notes:read (which requires pto:read) plus canViewNote.
        Normal cookie CSRF remains; verified cookie-free PAT writes may omit
        Origin, but foreign Origin is still rejected. Global limiting applies.
        Writes one internal audit row in the same transaction as the create;
        the row never contains the note text and is not returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePTORequest'
      responses:
        '201':
          description: PTO created
          headers:
            X-Request-Id:
              schema: { type: string, format: uuid }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PTO'
        '400':
          description: Validation error
          headers:
            X-Request-Id:
              schema: { type: string, format: uuid }
