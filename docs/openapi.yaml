              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
    put:
      security:
        - cookieAuth: []
        - personalToken: []
      summary: Update PTO by id
      tags: [PTO]
      description: |
        Legacy PUT remains scoped: PAT_WRITES_ENABLED AND pto:update:self for
        an owned record, or pto:update:team AND live lead/admin eligibility.
        Scope AND role AND record authorization must pass; self-only lead
        tokens cannot update colleagues. Note omission preserves the stored
        note, but the response still redacts it unless note-read plus
        canViewNote pass. Write-only tokens never disclose hidden stored notes.
        Normal CSRF/foreign-Origin and global limiter protections remain.
        Writes one internal audit row in the same transaction as the update;
        the row never contains the note text and is not returned.

        The expected version is required: send it as one canonical quoted
        strong `If-Match` value such as `"1"`. A missing header is 428, a
        malformed one is 400, and an outdated one is 412 STALE_WRITE with the
        stored record untouched. The version check, the write, the increment
        and the audit row are one transaction, so a stale write never lands.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/IfMatchVersion'
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        description: |
          Both dates are required; single-day PTO also requires dayPart.
          Omit note to preserve its stored value, send an empty string to clear it
          to null, or send a non-empty string to replace it. A provided note must
          be a string of at most 500 characters; null is invalid. Unknown
          fields are rejected and the owner can never be transferred.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePTORequest'
      responses:
        '200':
          description: PTO updated, with the incremented version
          headers:
            X-Request-Id:
              schema: { type: string, format: uuid }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PTO'
        '400':
          description: >
            Validation error: an invalid body, an unknown field, or a
            malformed/unsupported If-Match value (a list, a wildcard, a weak
            validator, an unquoted number or a version outside 1..2147483647).
          headers:
            X-Request-Id:
              schema: { type: string, format: uuid }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          headers:
            X-Request-Id:
              schema: { type: string, format: uuid }
