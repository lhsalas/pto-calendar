  /pto/{id}:
    get:
      security:
        - cookieAuth: []
        - personalToken: []
      summary: Get PTO by id
      tags: [PTO]
      description: |
        PATs require pto:read. Notes require pto:notes:read AND canViewNote:
        owners or current leads/admins, never arbitrary shared-calendar readers.
        Missing notes permission redacts note to null rather than widening it.
        Subject to the global limiter.
