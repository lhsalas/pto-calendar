          headers:
            X-Request-Id:
              schema: { type: string, format: uuid }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '412':
          $ref: '#/components/responses/StaleWrite'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
    patch:
      security:
        - cookieAuth: []
        - personalToken: []
      summary: Partially update PTO by id
      tags: [PTO]
      description: |
        PATCH changes only the fields it carries. An omitted key preserves the
        stored value, so a client never has to read, merge or write back a
        field it did not change. The merged record is validated with the
        current date, day-part, note and overlap rules before anything is
        written.

        The note contract matches the legacy PUT (#237) and adds an explicit
        null: omit `note` to preserve it, send `null` or an empty string to
        clear it, or send a non-empty string to replace it. A missing note-read
        scope is never widened into a read/merge/write requirement, and a
        stored note that the caller may not read is never disclosed in the
        response.

        Authorization is the same as the legacy PUT: PAT_WRITES_ENABLED AND
        pto:update:self for an owned record, or pto:update:team AND live
        lead/admin eligibility. Scope AND role AND record authorization must
        pass, and the owner can never be transferred.

        The expected version is required: send it as one canonical quoted
        strong `If-Match` value such as `"1"`. A missing header is 428, a
        malformed one is 400, and an outdated one is 412 STALE_WRITE with the
        stored record untouched. The version check, the write, the increment
        and the audit row are one transaction, so a stale write never lands
        and is never retried automatically.
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/IfMatchVersion'
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        description: |
          A non-empty object with only `startDate`, `endDate`, `dayPart` and
          `note`. At least one key is required and unknown keys are rejected.
          The merged record must still satisfy every create-time rule, so a
          range that becomes a single day needs a valid `dayPart`.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchPTORequest'
      responses:
        '200':
          description: PTO updated, with the incremented version
          headers:
            X-Request-Id:
              schema: { type: string, format: uuid }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PTO'
        '400':
          description: >
            Validation error: an empty body, an unknown field, a merged record
            that breaks the date/day-part/note rules, or a malformed/unsupported
            If-Match value (a list, a wildcard, a weak validator, an unquoted
            number or a version outside 1..2147483647).
          headers:
            X-Request-Id:
              schema: { type: string, format: uuid }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          headers:
            X-Request-Id:
              schema: { type: string, format: uuid }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not allowed to modify PTO
          headers:
            X-Request-Id:
              schema: { type: string, format: uuid }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: PTO not found
          headers:
            X-Request-Id:
              schema: { type: string, format: uuid }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: PTO overlaps an existing PTO entry for the same user
          headers:
            X-Request-Id:
              schema: { type: string, format: uuid }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '412':
          $ref: '#/components/responses/StaleWrite'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
    delete:
      security:
        - cookieAuth: []
        - personalToken: []
      summary: Delete PTO by id
      tags: [PTO]
      description: |
        PAT_WRITES_ENABLED AND pto:delete:self for an owned record, or
        pto:delete:team AND live lead/admin eligibility. Scope AND role AND
        record authorization must pass. Self-only lead tokens stay self-only.
        Normal CSRF/foreign-Origin and global limiter protections remain.
        Writes one internal audit row in the same transaction as the delete;
        the row is not returned.

        The expected version is required: send it as one canonical quoted
        strong `If-Match` value such as `"1"`. A missing header is 428, a
        malformed one is 400, and an outdated one is 412 STALE_WRITE. A stale
