openapi: 3.0.3
# Scoped bearer REST is implemented behind disabled-by-default server flags.
# docs/agent-access-delivery-plan.md, tracked by #246 and owning #249–#269 PRs.
# #255 adds opt-in cursor pagination for GET /pto. #256 adds versioned writes:
# a record version, required If-Match preconditions and PATCH. The client
# packages remain separate deliverables.
info:
  title: PTO / Vacation Calendar API
  version: 1.5.0
  description: |
    API for managing PTO requests in a shared team calendar.

    ## Optimistic concurrency
    Every PTO record carries a positive integer `version`, starting at 1 for
    new and migrated rows. It is returned by `GET /pto/{id}`, by `POST /pto`,
    `PUT /pto/{id}` and `PATCH /pto/{id}`, and by the items of the opt-in
    paged list. The historical capped array keeps its shape and carries no
    version.

    `PUT`, `PATCH` and `DELETE` on `/pto/{id}` require exactly one canonical
    quoted strong `If-Match` value that states the expected version, for
    example `"1"`. The header carries one value only: a list, `*`, a weak
    validator (`W/"1"`), an unquoted number or any other spelling is rejected.
    The number is an integer in 1..2147483647.

    - A missing `If-Match` is `428 PRECONDITION_REQUIRED`.
    - A malformed or out-of-range `If-Match` is `400 VALIDATION_ERROR`.
    - A well-formed but outdated `If-Match` is `412 STALE_WRITE`. The stored
      record is unchanged: refetch it, show the difference and confirm again.
      The server never retries a stale write and never overwrites silently.
    - A business conflict such as an overlapping PTO stays `409 CONFLICT`. A
      failed precondition is never reported as a business conflict.

    The version check, the write, the version increment and the audit row
    happen in one transaction/conditional statement, so two concurrent updates
    based on one version cannot both succeed and a stale delete cannot remove
    a newer revision. Older browser clients that do not send the precondition
    receive `428` and must refresh; there is no unguarded write path.

    ## Personal-token access
    PAT_AUTH_ENABLED and PAT_WRITES_ENABLED default false in every environment.
    A bearer alternative exists ONLY on the six explicitly marked operations.
    Never send a Cookie header with Authorization (even an empty/invalid cookie).
    Empty, malformed, duplicate, invalid or disabled credentials, ineligible
    routes and verifier database errors return generic 401 UNAUTHENTICATED;
    a failed bearer never falls back to a session. Valid scope/role/ownership or
    disabled-write denials return 403 FORBIDDEN.
    Verification checks live expiry, revocation, password eligibility, credential
    version and role on every request: reset/revoke/demotion apply immediately.
    Promotion cannot revive an invalidated token. These flags remain disabled
    in production until the separate audit/quota/query/client/pilot gates pass.
    Authorization-bearing responses are no-store with safe X-Request-Id.

    ## Operational notes
    - Every response carries an `X-Request-Id` header (UUID v4) that mirrors
      an inbound `X-Request-Id` when the client supplied one. Use this to
      correlate with server logs.
    - Two unauthenticated probes are exposed for orchestrators: `GET /health`
      (liveness, no DB) and `GET /ready` (readiness, DB probe).
    - PTO mutations and personal-token/credential-lifecycle changes write an
      internal audit row in the same transaction as the mutation. The row
      records the actor, the credential type (`session`,
      `personal_access_token`, `setup_token`, `operator`), the source public
      token ID when a personal token authorized the call, the target owner, the
      timestamp and the safe `X-Request-Id`. It never contains note text, raw
      tokens, digests or passwords. The audit trail is internal: it is not
      browsable through this API.
    - All routes are subject to a global IP rate limiter
      (`RATE_LIMIT_MAX` per `RATE_LIMIT_WINDOW_MS`). `POST /auth/login` is
      additionally subject to a stricter login limiter
      (`AUTH_RATE_LIMIT_MAX` per window) that counts failed attempts only.
      Both return `429 Too Many Requests` with `Retry-After` and the body
      `{ "error": { "code": "RATE_LIMITED", "message": "..." } }`.
    - Personal-token traffic is additionally bounded per verified caller. A
      failed personal-token verification is charged before the credential
      lookup (`RATE_LIMIT_BEARER_FAILURE_MAX` per attempt window per client
      address) and refunded as soon as the secret verifies. Every
      authenticated request is charged once against the verified user
      (`RATE_LIMIT_USER_QUOTA_MAX` per `RATE_LIMIT_QUOTA_WINDOW_MS`) and, for
      a personal token, against the verified token
      (`RATE_LIMIT_TOKEN_QUOTA_MAX` per window). Token creation
      (`RATE_LIMIT_TOKEN_ISSUANCE_MAX`) and the issuance password check
      (`RATE_LIMIT_TOKEN_PASSWORD_MAX`) have their own per-owner budgets and
      never consume the browser login budget; the password budget is charged
      before the password comparison and is not given back, so it bounds the
      comparisons themselves. A rejection answers `429` with `Retry-After` of
      the exact rejecting window and the same
      `{ "error": { "code": "RATE_LIMITED", "message": "..." } }` body. The
      operational probes stay exempt from every quota.
    - The global address high-water still binds first with the conservative
      defaults, so callers behind one shared address share that ceiling until
      an operator raises `RATE_LIMIT_MAX` explicitly. Every limiter value is
      an operator override in the deployment files.
servers:
  - url: https://api.example.com
    description: Production
  - url: http://localhost:3000
    description: Local
security:
  - cookieAuth: []
paths:
  /health:
    get:
      security: []
      summary: Liveness probe
      tags: [Health]
      description: |
        Always returns 200 with `{ "status": "ok" }` while the process is
        responsive. Does not check the database. Use this to decide whether
        to restart the process.
      responses:
        '200':
          description: Service is alive
          headers:
            X-Request-Id:
              description: Correlation ID echoed from the request, or a generated UUID v4.
              schema: { type: string, format: uuid }
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
  /ready:
    get:
      security: []
      summary: Readiness probe
      tags: [Health]
      description: |
        Runs `SELECT 1` against the database with a `READY_TIMEOUT_MS` race
        timer. Returns 200 when the DB responds in time, 503 otherwise.
        Use this to decide whether to route traffic.
      responses:
        '200':
          description: Service is ready to serve traffic
          headers:
            X-Request-Id:
              description: Correlation ID echoed from the request, or a generated UUID v4.
              schema: { type: string, format: uuid }
          content:
            application/json:
              schema:
                type: object
                required: [status, db, uptime]
                properties:
                  status:
                    type: string
                    enum: [ready]
                  db:
                    type: string
                    enum: [ok]
                  uptime:
                    type: number
                    description: Process uptime in seconds.
        '503':
          description: Service is not ready (DB unreachable or probe timed out)
          headers:
            X-Request-Id:
              description: Correlation ID echoed from the request, or a generated UUID v4.
              schema: { type: string, format: uuid }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notReady:
                  value:
                    error:
                      code: NOT_READY
                      message: 'Database is not reachable'
                      details:
                        db: unreachable
                        reason: timeout
                        timeoutMs: 5000
  /auth/login:
    post:
      security: []
      summary: Log in a user
      tags: [Auth]
      description: |
        Subject to the strict login limiter (`AUTH_RATE_LIMIT_MAX` failed
        attempts per `RATE_LIMIT_WINDOW_MS` per IP, with
        `skipSuccessfulRequests: true`). Also subject to the global limiter.
        On rate-limit hit, returns `429` with `Retry-After` and the body
        `{ "error": { "code": "RATE_LIMITED", "message": "..." } }`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in successfully
          headers:
            X-Request-Id:
              description: Correlation ID echoed from the request, or a generated UUID v4.
              schema: { type: string, format: uuid }
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Invalid credentials
          headers:
            X-Request-Id:
              schema: { type: string, format: uuid }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many requests (login or global limiter tripped)
          headers:
            Retry-After:
              description: Seconds until the limiter window resets.
              schema: { type: integer, minimum: 0 }
            X-Request-Id:
              schema: { type: string, format: uuid }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                rateLimited:
                  value:
                    error:
                      code: RATE_LIMITED
                      message: 'Too many login attempts. Please try again later.'
  /auth/logout:
    post:
      summary: Log out current user
      tags: [Auth]
      responses:
        '204':
          description: Logged out
          headers:
            X-Request-Id:
              schema: { type: string, format: uuid }
  /auth/me:
    get:
      security:
        - cookieAuth: []
        - personalToken: []
      summary: Get current authenticated user
      tags: [Auth]
      description: |
        A session keeps the existing User response. A verified cookie-free PAT
        returns only actor ID/current role and safe auth method/token public
        ID/scopes/absolute expiry, without requiring pto:read. No secret, password,
        browser credential version or user administration fields are exposed.
      responses:
        '200':
          description: Current user
          headers:
            X-Request-Id:
              schema: { type: string, format: uuid }
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/User'
                  - $ref: '#/components/schemas/PersonalTokenIdentity'
        '401':
          description: Not authenticated
          headers:
            X-Request-Id:
              schema: { type: string, format: uuid }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/tokens:
    get:
      tags: [Auth]
      summary: List the browser session owner's safe token metadata
      description: |
        All three roles manage only their own tokens. No query parameters are
        accepted. Every management response, including early errors, uses
        Cache-Control no-store and a safe X-Request-Id. Any Authorization header
        is rejected, even with a valid session; PATs cannot manage tokens.
      responses:
        '200':
          description: Safe metadata only; no digest, raw token or credential version
          headers:
            Cache-Control: { $ref: '#/components/headers/TokenNoStore' }
            X-Request-Id: { $ref: '#/components/headers/TokenRequestId' }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [tokens]
                properties:
                  tokens:
                    type: array
                    items: { $ref: '#/components/schemas/PersonalTokenMetadata' }
        '400': { $ref: '#/components/responses/TokenManagementError' }
        '401': { $ref: '#/components/responses/TokenManagementError' }
        '413': { $ref: '#/components/responses/TokenManagementError' }
        '415': { $ref: '#/components/responses/TokenManagementError' }
        '429': { $ref: '#/components/responses/TokenManagementError' }
        '500': { $ref: '#/components/responses/TokenManagementError' }
    post:
      tags: [Auth]
      summary: Issue one personal token after verifying the current password
      description: |
        Session-only; owner is derived from the session. Verify the current
        password on every issuance; share the failed-auth limiter with login
        and setup (successful responses are excluded). Defaults to read-only
        scope and 90 days; hard lifetime maximum is 365*24h and active cap is 10.
        Team scopes require a live lead/admin role. RawToken is returned once,
        never retrieved later. Normal cookie CSRF/Origin protections apply.
        No bearer authentication or settings UI is supplied by this endpoint.
        Writes one internal audit row with the credential attribution
        described in the API description; the row is not returned.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IssuePersonalTokenRequest' }
      responses:
        '201':
          description: Show-once raw credential and safe metadata; do not persist the response
          headers:
            Cache-Control: { $ref: '#/components/headers/TokenNoStore' }
            X-Request-Id: { $ref: '#/components/headers/TokenRequestId' }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [rawToken, token]
                properties:
                  rawToken:
                    type: string
                    pattern: '^pto_pat_[0-9a-f-]{36}\.[0-9a-f]{64}$'
                    description: One-time secret; never present in later management responses.
                  token: { $ref: '#/components/schemas/PersonalTokenMetadata' }
        '400': { $ref: '#/components/responses/TokenManagementError' }
        '401': { $ref: '#/components/responses/TokenManagementError' }
        '403': { $ref: '#/components/responses/TokenManagementError' }
        '409': { $ref: '#/components/responses/TokenManagementError' }
        '413': { $ref: '#/components/responses/TokenManagementError' }
        '415': { $ref: '#/components/responses/TokenManagementError' }
        '429': { $ref: '#/components/responses/TokenManagementError' }
        '500': { $ref: '#/components/responses/TokenManagementError' }
  /auth/tokens/{id}:
    delete:
      tags: [Auth]
      summary: Revoke one own token without a fresh password
      description: |
        Session-only with normal CSRF/Origin checks; no Authorization header or
        query fields accepted. An absent or empty body is allowed. Repeating
        an own revocation returns 204; foreign and unknown valid UUIDs both
        return 404. Revoked metadata is retained; logout is not PAT revocation.
        Writes one internal audit row with the credential attribution described
        in the API description, and only when the token's state actually
        changes; a repeated own revocation writes none. The row is not returned.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmptyTokenManagementRequest' }
      responses:
        '204':
          description: Own token revoked, or already revoked; no response body
          headers:
            Cache-Control: { $ref: '#/components/headers/TokenNoStore' }
            X-Request-Id: { $ref: '#/components/headers/TokenRequestId' }
        '400': { $ref: '#/components/responses/TokenManagementError' }
        '401': { $ref: '#/components/responses/TokenManagementError' }
        '403': { $ref: '#/components/responses/TokenManagementError' }
        '404': { $ref: '#/components/responses/TokenManagementError' }
        '413': { $ref: '#/components/responses/TokenManagementError' }
        '415': { $ref: '#/components/responses/TokenManagementError' }
        '429': { $ref: '#/components/responses/TokenManagementError' }
        '500': { $ref: '#/components/responses/TokenManagementError' }
  /auth/tokens/revoke-all:
    post:
      tags: [Auth]
      summary: Revoke all own tokens without a fresh password
      description: |
        Session-only with normal CSRF/Origin checks, no Authorization header or
        query fields, and only an absent or empty body. Does not affect another
        owner. Incident revocation does not use the issuance/password limiter.
        Writes one internal audit row per token whose state actually changed;
        a no-op writes none.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmptyTokenManagementRequest' }
      responses:
        '204':
          description: All own tokens revoked; no response body
          headers:
            Cache-Control: { $ref: '#/components/headers/TokenNoStore' }
            X-Request-Id: { $ref: '#/components/headers/TokenRequestId' }
        '400': { $ref: '#/components/responses/TokenManagementError' }
        '401': { $ref: '#/components/responses/TokenManagementError' }
        '403': { $ref: '#/components/responses/TokenManagementError' }
        '413': { $ref: '#/components/responses/TokenManagementError' }
        '415': { $ref: '#/components/responses/TokenManagementError' }
        '429': { $ref: '#/components/responses/TokenManagementError' }
        '500': { $ref: '#/components/responses/TokenManagementError' }
  /auth/setup-account:
    post:
      summary: Redeem a one-time setup token and set the initial password
      tags: [Auth]
      description: |
        Public endpoint. The lead creates a user via `POST /users` and shares
        the returned one-time `setupToken` link with the new member; the member
        opens `/setup-account#token=...` and submits a password. The token is
        sha256-hashed in the database, expires after `SETUP_TOKEN_TTL_MS`
        (default 24h), and is single-use. Rate-limited by the same login
        limiter as `POST /auth/login`. The claim writes one internal audit row
        attributed to the claimed account with a `setup_token` credential; the
        row is not returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupAccountRequest'
      responses:
        '200':
          description: Password set, session established, user returned.
          headers:
            Set-Cookie:
              description: session cookie issued via `cookie-session`.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: Validation error (token or password missing/invalid).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Token is missing/expired/already-spent. Identical response to avoid enumeration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          description: Setup-account rate limit tripped.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /users:
    get:
      summary: List users (team lead only)
      tags: [Users]
      description: Returns the public user list. Requires team lead.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: User list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Authenticated but not a team lead.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    post:
      summary: Create a user (team lead only)
      tags: [Users]
      description: |
        Team-lead only. Creates a member with `passwordHash: null` and a fresh
        one-time setup token; returns the user + plaintext `setupToken` +
        `expiresAt`. The setup link is shown ONCE in the admin UI for the lead
        to copy. The creation writes one internal audit row attributed to the
        acting session; the row is not returned.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateUserResponse'
        '400':
          description: Validation error.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Authenticated but not a team lead.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Email already exists (lowercased uniqueness).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /users/{id}/reset-password:
    post:
      summary: Reset a user's password (team lead only)
      tags: [Users]
      description: |
        Team-lead only. Clears the target user's `passwordHash`, issues a fresh
        one-time setup token, and returns the new plaintext token. Blocks
        self-reset and reset of the only team_lead in the system. The
        credential-version invalidation writes one internal audit row in the
        same transaction as the reset; the row never contains the setup token
        and is not returned.
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Reset token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetPasswordResponse'
        '400':
          description: Attempted to reset the only team_lead (refused) or reset self.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Authenticated but not a team lead.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: User not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /pto:
    get:
      security:
        - cookieAuth: []
        - personalToken: []
      summary: List PTO entries overlapping a visible calendar date range
      tags: [PTO]
      description: |
        PATs require pto:read. Shared calendar metadata includes no notes: list
        notes remain null even with pto:notes:read. Subject to the global limiter.

        Two representations are available. Without `format` the response is the
        historical JSON array, capped at 1,000 rows. With `format=page` the
        response is the `PTOCalendarPage` envelope. Use its `hasMore` and
        `nextCursor` to traverse more than 1,000 matching records without
        silently truncating the result. Agent clients must use paged mode.
        Only the paged items carry the record `version`; the historical array
        keeps its previous shape and carries no version.

        The optional `userId` filter is applied in the database before sorting
        and limiting, so an unrelated owner can never consume the budget of a
        filtered query. A syntactically valid owner that does not exist yields
        an empty result, not an error.

        Ordering is deterministic: `(startDate, userId, id)`. The continuation
        cursor is an opaque, server-minted integrity token bound to the range
        and the owner filter; it is not an authorization or snapshot token, and
        a malformed, tampered or mismatched cursor is rejected with a generic
        `400 VALIDATION_ERROR` that never echoes the cursor. Cursors stop
        working after the active session key rotates.

        Pages are not a point-in-time snapshot. Rows created, deleted or moved
        between two page requests can be missed or repeated. Within a bounded
        page and time budget, deduplicate by PTO id and detect repeated IDs,
        repeated cursors or a missing cursor when `hasMore` is true. Report
        incomplete results on these anomalies, budget exhaustion before the
        last page, abort or error. Not all concurrent changes are detectable.
      parameters:
        - in: query
          name: start
          required: true
          schema:
            type: string
            format: date
            example: 2026-04-27
          description: Visible calendar grid start date in YYYY-MM-DD format. The range must be valid, ordered, and no more than 366 days.
        - in: query
          name: end
          required: true
          schema:
            type: string
            format: date
            example: 2026-05-31
          description: Visible calendar grid end date in YYYY-MM-DD format. The range must be valid, ordered, and no more than 366 days.
        - in: query
          name: userId
          required: false
          schema:
            type: string
            format: uuid
          description: >
            Restrict the result to one owner. The identifier is validated and
            normalized before it is bound to the query, and the filter is
            applied in the database before sorting and limiting.
        - in: query
          name: format
          required: false
          schema:
            type: string
            enum: [page]
          description: >
            Opt in to the paged envelope. Without this parameter the response
            stays the historical JSON array. `limit` and `cursor` are only
            accepted together with `format=page`.
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
          description: >
            Page size for `format=page`. A single canonical decimal integer is
            required: no sign, no leading zeros, no fraction, no exponent and
            no surrounding whitespace. Only valid with `format=page`.
        - in: query
          name: cursor
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 512
          description: >
            Continuation cursor returned as `nextCursor`. It must be repeated
            unchanged with the same `start`, `end` and normalized `userId`.
            The `limit` may change between pages. Only valid with `format=page`.
      responses:
        '200':
          description: >
            The historical array when `format` is absent, otherwise the paged
            envelope. `nextCursor` is null exactly when `hasMore` is false.
          headers:
            X-Request-Id: { $ref: '#/components/headers/TokenRequestId' }
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PTOCalendarPage'
                  - type: array
                    maxItems: 1000
                    items:
                      $ref: '#/components/schemas/PTOListItem'
        '400':
          description: >
            Invalid query: an impossible or reversed date range, a range
            longer than 366 days, a malformed owner filter, a page size
            outside 1..200, a page-only argument without `format=page`, or a
            malformed, tampered or mismatched cursor. The cursor is never
            echoed.
          headers:
            X-Request-Id: { $ref: '#/components/headers/TokenRequestId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          headers:
            X-Request-Id:
              schema: { type: string, format: uuid }
          content:
            application/json:
