components:
  headers:
    TokenNoStore:
      description: Credential responses must never be cached, including errors.
      schema: { type: string, enum: [no-store] }
    TokenRequestId:
      description: Safe inbound correlation ID or a generated UUID v4.
      schema: { type: string, pattern: '^[A-Za-z0-9._-]{1,200}$' }
  responses:
    PreconditionRequired:
      description: |
        428 PRECONDITION_REQUIRED. The write needs the expected record
        version, sent as one canonical quoted strong `If-Match` value such as
        `"1"`. Older clients that do not send it must refresh the record and
        retry with its current version; the server never grants an unguarded
        write.
      headers:
        X-Request-Id: { $ref: '#/components/headers/TokenRequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            preconditionRequired:
              value:
                error:
                  code: PRECONDITION_REQUIRED
                  message: Send the expected record version in If-Match.
    StaleWrite:
      description: |
        412 STALE_WRITE. The record changed after the caller read it, so the
        stored data is left untouched. Refetch the record, show the difference
        and confirm again; the server never retries a stale write and never
        overwrites silently. A business conflict stays 409.
      headers:
        X-Request-Id: { $ref: '#/components/headers/TokenRequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            staleWrite:
              value:
                error:
                  code: STALE_WRITE
                  message: This PTO changed since you loaded it. Reload and try again.
    PatForbidden:
      description: |
        403 FORBIDDEN for insufficient PAT scope, disabled writes or failed
        live role/record authority. CSRF_REJECTED for a foreign write Origin.
        All Authorization-bearing responses are no-store.
      headers:
        Cache-Control: { $ref: '#/components/headers/TokenNoStore' }
        X-Request-Id: { $ref: '#/components/headers/TokenRequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    TokenManagementError:
      description: |
        400 VALIDATION_ERROR (strict input/UUID/query), 401 UNAUTHENTICATED
        (session/current password/Authorization denial),
        403 FORBIDDEN (team scopes) or CSRF_REJECTED (Origin),
        404 NOT_FOUND (foreign/unknown token), 409 TOKEN_LIMIT_REACHED,
        413 PAYLOAD_TOO_LARGE, 415 UNSUPPORTED_MEDIA_TYPE,
        429 RATE_LIMITED, or a generic 500 INTERNAL_ERROR.
        No submitted credentials, validation inputs or private causes are returned.
      headers:
        Cache-Control: { $ref: '#/components/headers/TokenNoStore' }
        X-Request-Id: { $ref: '#/components/headers/TokenRequestId' }
        Retry-After:
          description: Present on 429 responses; seconds until the limit resets.
          schema: { type: integer, minimum: 0 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Unauthenticated — no valid session cookie.
      headers:
        X-Request-Id:
          schema: { type: string, format: uuid }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unauthenticated:
              value:
                error: { code: UNAUTHENTICATED, message: Not authenticated. }
    RateLimited:
      description: |
        Too many requests. Returned by the global limiter on every route, by
        the stricter login limiter on `POST /auth/login` and by the
        personal-token quotas (failed bearer verification, verified-user
        traffic, verified-token traffic, token issuance and the issuance
        password check).
      headers:
        Retry-After:
          description: Seconds until the exact rejecting window resets.
          schema: { type: integer, minimum: 0 }
        X-Request-Id:
          description: Correlation ID echoed from the request, or a generated UUID v4.
          schema: { type: string, format: uuid }
        RateLimit:
          description: Draft-7 limit, remaining requests and reset time of the rejecting budget.
          schema: { type: string }
        RateLimit-Policy:
          description: Limit and window length of the rejecting budget.
          schema: { type: string }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            rateLimited:
              value:
                error:
                  code: RATE_LIMITED
                  message: 'Too many requests. Try again later.'
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
    personalToken:
      type: http
      scheme: bearer
      bearerFormat: pto_pat_<public-uuid-v4>.<64-lowercase-hex-secret>
      description: |
        Only eligible operations opt in; both server rollout flags default off.
        Send exactly one Authorization header and no Cookie header. No fallback
        to browser sessions. This is a personal REST credential, not HTTP MCP OAuth.
  parameters:
    RequestIdHeader:
      name: X-Request-Id
      in: header
      required: false
      description: Optional client-supplied correlation ID; echoed in the response header and used in logs.
      schema:
        type: string
        format: uuid
    IfMatchVersion:
      name: If-Match
      in: header
      required: true
      description: >
        The expected version of the record, as exactly one canonical quoted
        strong entity-tag that states the decimal version: `"1"`, `"2"`, and
        so on. One value only — a list, `*`, a weak validator (`W/"1"`), an
        unquoted number or any other spelling is rejected with
        `400 VALIDATION_ERROR`. The version is an integer in 1..2147483647; a
        canonical value outside that range is rejected the same way. A missing
        header is `428 PRECONDITION_REQUIRED` and an outdated value is
        `412 STALE_WRITE`. Use the JSON `version`, not any transport-generated
        ETag. This write contract does not define conditional reads.
      schema:
        type: string
        pattern: '^"[1-9][0-9]{0,9}"$'
        example: '"1"'
  schemas:
    PersonalTokenIdentity:
      type: object
      additionalProperties: false
      required: [id, role, auth]
      properties:
        id: { type: string, format: uuid }
        role: { $ref: '#/components/schemas/Role' }
        auth:
          type: object
          additionalProperties: false
          required: [method, tokenId, scopes, expiresAt]
          properties:
            method: { type: string, enum: [pat] }
            tokenId: { type: string, format: uuid }
            scopes:
              type: array
              items: { $ref: '#/components/schemas/PersonalTokenScope' }
            expiresAt: { type: string, format: date-time }
    EmptyTokenManagementRequest:
      type: object
      additionalProperties: false
      properties: {}
    PersonalTokenScope:
      type: string
      enum: ['pto:read', 'pto:notes:read', 'pto:create', 'pto:update:self', 'pto:delete:self', 'pto:update:team', 'pto:delete:team']
    IssuePersonalTokenRequest:
      type: object
      additionalProperties: false
      required: [name, password]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: Nonempty, at most 120 Unicode code points, no leading/trailing whitespace.
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 72
          writeOnly: true
          description: Current password, verified on every issuance; never stored or echoed.
        scopes:
          type: array
          minItems: 1
          maxItems: 7
          uniqueItems: true
          default: ['pto:read']
          items: { $ref: '#/components/schemas/PersonalTokenScope' }
          description: Notes require read; team scopes require live lead/admin eligibility. No implied notes or writes.
        expiresInDays:
          type: integer
          minimum: 1
          maximum: 365
          default: 90
    PersonalTokenMetadata:
      type: object
      additionalProperties: false
      required: [id, name, displayPrefix, scopes, createdAt, expiresAt, lastUsedAt, revokedAt, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 120 }
        displayPrefix:
          type: string
          description: Non-secret pto_pat_ plus the public UUID, not a secret fragment.
        scopes:
          type: array
          items: { $ref: '#/components/schemas/PersonalTokenScope' }
        createdAt: { type: string, format: date-time }
        expiresAt:
          type: string
          format: date-time
          description: Absolute UTC expiry, at most 365*24h after creation.
        lastUsedAt: { type: string, format: date-time, nullable: true }
        revokedAt: { type: string, format: date-time, nullable: true }
        status:
          type: string
          enum: [active, expired, revoked, invalidated]
          description: >-
            Server-computed state of the owner's own token. Revoked wins over
            expired, which wins over invalidated; invalidated covers a changed
            session version, a reset account and a live role that no longer
            fits the token's team scopes. Clients must not derive it locally.
    Role:
      type: string
      enum: [member, team_lead, admin]
    DayPart:
      type: string
      enum: [morning, evening, all_day]
    User:
      type: object
      required: [id, name, email, role, colorCode]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
        colorCode:
          type: string
          example: '#3B82F6'
    PTO:
      type: object
      required: [id, userId, startDate, endDate, dayPart, createdAt, updatedAt, version]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        dayPart:
          $ref: '#/components/schemas/DayPart'
        note:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          $ref: '#/components/schemas/PTORecordVersion'
    PTORecordVersion:
      type: integer
      minimum: 1
      maximum: 2147483647
      description: >
        Optimistic-concurrency revision of the record. It starts at 1 for new
        and migrated rows and increments by one on every successful write. It
        is the value a write must state as its `If-Match` precondition. The
        client must not derive or guess it: read it from the detail, create or
        paged response.
      example: 1
    PTOWithUser:
      type: object
      description: >
        Calendar metadata and a nullable note. For details, the note is
        visible only where the caller's role and credential scopes permit it.
      required: [id, user, startDate, endDate, dayPart]
      properties:
        id:
          type: string
          format: uuid
        user:
          type: object
          required: [id, name, colorCode]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            colorCode:
              type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        dayPart:
          $ref: '#/components/schemas/DayPart'
        note:
          type: string
          nullable: true
    PTODetail:
      description: >
        One PTO with the record version that a write must state as its
        `If-Match` precondition. The note is visible only where the caller's
        role and credential scopes permit it.
      allOf:
        - $ref: '#/components/schemas/PTOWithUser'
        - type: object
          required: [version]
          properties:
            version:
              $ref: '#/components/schemas/PTORecordVersion'
    PTOListItem:
      description: List metadata only. Notes are always null, for every role and scope.
      allOf:
        - $ref: '#/components/schemas/PTOWithUser'
        - type: object
          required: [note]
          properties:
            note:
              type: string
              nullable: true
              enum: [null]
    PTOPagedListItem:
      description: >
        One row of the opt-in paged list. Notes are always null, for every
        role and scope, and the row carries the record version so a client
        can write it back with the right precondition.
      allOf:
        - $ref: '#/components/schemas/PTOWithUser'
        - type: object
          required: [note, version]
          properties:
            note:
              type: string
              nullable: true
              enum: [null]
            version:
              $ref: '#/components/schemas/PTORecordVersion'
    PTOCalendarPage:
      type: object
      additionalProperties: false
      description: >
        The opt-in paged representation of GET /pto, returned when `format=page`
        is requested. It is not a point-in-time snapshot: rows created, deleted
        or moved between two page requests can be missed or repeated, so a
        client must deduplicate by PTO id and report an explicitly incomplete
        result when its own budget, abort or error ends the traversal.
      required: [items, nextCursor, hasMore]
      properties:
        items:
          type: array
          maxItems: 200
          description: >
            The rows of this page, ordered by `(startDate, userId, id)`. Every
            item has `note: null` and carries the record `version`.
          items:
            $ref: '#/components/schemas/PTOPagedListItem'
        nextCursor:
          type: string
          nullable: true
          minLength: 1
          maxLength: 512
          description: >
            Opaque continuation cursor for the next page, or null exactly when
            `hasMore` is false. It is an integrity token bound to the range and
            the owner filter, not an authorization or snapshot token.
        hasMore:
          type: boolean
          description: True when this read found at least one row beyond the returned items.
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          maxLength: 72
    Password:
      type: string
      format: password
      minLength: 8
      maxLength: 72
      description: |
        Plaintext password. Must be 8-72 characters (bcrypt's hard cap). Never
        echoed in any response body.
    SetupAccountRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          minLength: 32
          maxLength: 128
        password:
          $ref: '#/components/schemas/Password'
    CreateUserRequest:
      type: object
      required: [email, name]
      properties:
        email:
          type: string
          format: email
        name:
          type: string
          minLength: 1
          maxLength: 120
    CreateUserResponse:
      type: object
      required: [user, setupToken, expiresAt]
      properties:
        user:
          $ref: '#/components/schemas/User'
        setupToken:
          type: string
          description: |
            One-time plaintext setup token. Shown ONCE to the team lead and never
            recoverable from the server. The new member redeems it at
            /setup-account#token=...
        expiresAt:
          type: string
          format: date-time
    ResetPasswordResponse:
      type: object
      required: [setupToken, expiresAt]
      properties:
        setupToken:
          type: string
        expiresAt:
          type: string
          format: date-time
    CreatePTORequest:
      type: object
      description: Single-day PTO requires dayPart. Multi-day PTO is normalized to all_day. Weekend date selections and overlaps for the same user are rejected.
      required: [startDate, endDate]
      properties:
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        dayPart:
          $ref: '#/components/schemas/DayPart'
        note:
          type: string
          maxLength: 500
      example:
        startDate: 2026-05-10
        endDate: 2026-05-10
        dayPart: morning
        note: Doctor appointment
    UpdatePTORequest:
      type: object
      additionalProperties: false
      description: >
        Same validation rules as create. Update is allowed only for the owner
        or a team lead. Notes are visible only to the owner and team leads.
        Both dates stay required, unknown fields are rejected and the owner
        can never be transferred.
      required: [startDate, endDate]
      properties:
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        dayPart:
          $ref: '#/components/schemas/DayPart'
        note:
          type: string
          maxLength: 500
          description: Omitted preserves the stored note; an empty string clears it to null; a non-empty string replaces it. Null is not accepted.
    PatchPTORequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: >
        A non-empty set of changed fields. Every omitted key preserves the
        stored value, so a client never has to read, merge or write back a
        field it did not change. The merged record is validated with the
        current date, day-part, note and overlap rules before anything is
        written. The owner can never be transferred.
      properties:
        startDate:
          type: string
          format: date
          description: Replaces the stored start date. The merged range must still be valid.
        endDate:
          type: string
          format: date
          description: Replaces the stored end date. The merged range must still be valid.
        dayPart:
          $ref: '#/components/schemas/DayPart'
          description: >
            Replaces the stored day part. A merged record that covers a single
            day needs a valid day part.
        note:
          type: string
          nullable: true
          maxLength: 500
          description: >
            Omitted preserves the stored note; `null` or an empty string clears
            it; a non-empty string replaces it. A stored note the caller may
            not read is never disclosed in the response.
      example:
        dayPart: evening
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: |
                Machine-readable error code. Common values:
                  - `UNAUTHENTICATED` (401)
                  - `FORBIDDEN` (403)
                  - `CSRF_REJECTED` (403) — state-changing request origin is not allowed
                  - `VALIDATION_ERROR` (400)
                  - `NOT_FOUND` (404)
                  - `CONFLICT` (409) — business conflict, for example an overlap
                  - `STALE_WRITE` (412) — the expected version no longer matches
                  - `PRECONDITION_REQUIRED` (428) — the expected version header is missing
                  - `RATE_LIMITED` (429) — see `Retry-After` header
                  - `NOT_READY` (503) — readiness probe only
                  - `INTERNAL_ERROR` (500)
              example: FORBIDDEN
            message:
              type: string
              example: You are not allowed to modify this PTO entry.
    Holiday:
      type: object
      required: [id, date, name, countryCode]
      properties:
        id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        name:
          type: string
          maxLength: 120
        countryCode:
          type: string
          nullable: true
          description: ISO 3166-1 alpha-2 country code, or null for locale-agnostic holidays. Two holidays on the same date with different country codes coexist; the unique key is (date, country_code).
          example: US
    CreateHolidayRequest:
      type: object
      required: [date, name]
      properties:
        date:
          type: string
          format: date
        name:
          type: string
          maxLength: 120
        countryCode:
          type: string
          nullable: true
          description: ISO 3166-1 alpha-2 country code, or null for locale-agnostic holidays. Omit for null.
          example: US
    SeedHolidayRequest:
      type: object
      required: [countryCode]
      properties:
        countryCode:
          type: string
          enum: [US, MX, CO, CL]
    SeedHolidayResponse:
      type: object
      required: [inserted, skipped, errors]
      properties:
        inserted:
          type: integer
        skipped:
          type: integer
        errors:
          type: array
          items: { type: string }
