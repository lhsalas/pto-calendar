name: Deploy secrets only

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (defaults to the latest in Artifact Registry).'
        required: false
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: production-deploy-secrets
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  GCP_ARTIFACT_REGISTRY_REPOSITORY: ${{ vars.GCP_ARTIFACT_REGISTRY_REPOSITORY }}
  CLOUD_RUN_SERVICE: pto-api
  FIREBASE_SITE_ORIGIN: ${{ vars.FIREBASE_SITE_ORIGIN }}
  GCP_DIRECT_URL_SECRET: ${{ vars.GCP_DIRECT_URL_SECRET }}
  GCP_DATABASE_URL_SECRET: ${{ vars.GCP_DATABASE_URL_SECRET }}
  GCP_SESSION_SECRET_SECRET: ${{ vars.GCP_SESSION_SECRET_SECRET }}
  GCP_RATE_LIMIT_REDIS_URL_SECRET: ${{ vars.GCP_RATE_LIMIT_REDIS_URL_SECRET }}
  GCP_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}

jobs:
  secrets:
    name: Update Cloud Run env vars and secrets
    if: vars.GCP_FALLBACK_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      IMAGE_TAG: ${{ inputs.image_tag || '' }}
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Resolve image tag from Artifact Registry
        if: env.IMAGE_TAG == ''
        run: |
          set -euo pipefail
          TAG=$(gcloud artifacts docker images list \
            "${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GCP_ARTIFACT_REGISTRY_REPOSITORY}/pto-api" \
            --format='value(IMAGE)' \
            --sort-by='~CREATE_TIME' \
            --limit=1 | awk -F: '{print $NF}')
          if [[ -z "${TAG}" ]]; then
            echo "::error::No images found in Artifact Registry for pto-api."
            exit 1
          fi
          echo "Latest image tag: ${TAG}"
          echo "IMAGE_TAG=${TAG}" >> "${GITHUB_ENV}"

      - name: Update Cloud Run revision
        env:
          IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_ARTIFACT_REGISTRY_REPOSITORY }}/pto-api:${{ env.IMAGE_TAG }}
        run: |
          set -euo pipefail
          gcloud run services update "${CLOUD_RUN_SERVICE}" \
            --image "${IMAGE}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --platform managed \
            --service-account "${GCP_RUNTIME_SERVICE_ACCOUNT}" \
            --update-env-vars "NODE_ENV=production,CORS_ORIGIN=${FIREBASE_SITE_ORIGIN},COOKIE_SECURE=true,COOKIE_SAME_SITE=none,COOKIE_DOMAIN=,TRUST_PROXY_HOPS=1,BCRYPT_ROUNDS=12,LOG_LEVEL=info,RATE_LIMIT_WINDOW_MS=900000,RATE_LIMIT_MAX=100,AUTH_RATE_LIMIT_MAX=5" \
            --update-secrets "SESSION_SECRET=${GCP_SESSION_SECRET_SECRET}:latest,DATABASE_URL=${GCP_DATABASE_URL_SECRET}:latest,RATE_LIMIT_REDIS_URL=${GCP_RATE_LIMIT_REDIS_URL_SECRET}:latest" \
            --quiet
          SERVICE_URL="$(gcloud run services describe "${CLOUD_RUN_SERVICE}" --project "${GCP_PROJECT_ID}" --region "${GCP_REGION}" --format='value(status.url)')"
          echo "service_url=${SERVICE_URL}" >> "${GITHUB_OUTPUT}"
          curl --fail --silent --show-error --max-time 30 "${SERVICE_URL}/health"
          curl --fail --silent --show-error --max-time 30 "${SERVICE_URL}/ready"
