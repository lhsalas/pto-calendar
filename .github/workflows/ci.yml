name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test-backend-unit:
    name: Backend unit tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://placeholder@localhost:5432/placeholder?schema=public
      SESSION_SECRET: ci-session-secret-that-is-long-enough-for-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run test -w backend

  test-backend-integration:
    name: Backend integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pto
          POSTGRES_PASSWORD: pto
          POSTGRES_DB: pto_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pto -d pto_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://pto:pto@localhost:5432/pto_test?schema=public
      SESSION_SECRET: ci-session-secret-that-is-long-enough-for-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npx prisma migrate deploy --schema=backend/prisma/schema.prisma
      - run: npm run test:integration:coverage -w backend
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage

  test-frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:coverage -w frontend
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [build]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pto
          POSTGRES_PASSWORD: pto
          POSTGRES_DB: pto_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pto -d pto_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://pto:pto@localhost:5432/pto_test?schema=public
      SESSION_SECRET: ci-session-secret-that-is-long-enough-for-tests
      VITE_API_BASE_URL: http://localhost:3000
      BCRYPT_ROUNDS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npx prisma migrate deploy --schema=backend/prisma/schema.prisma
      - run: PGPASSWORD=pto psql -h localhost -U pto -d pto_test -c "TRUNCATE pto_requests, audit_logs RESTART IDENTITY CASCADE;"
      - run: npm run db:seed -w backend
      - name: Start backend in the background
        run: |
          mkdir -p /tmp/e2e-logs
          nohup npm run dev -w backend > /tmp/e2e-logs/backend.log 2>&1 &
          echo "Backend PID: $!"
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/health >/dev/null 2>&1; then
              echo "Backend is healthy after ${i}s"
              break
            fi
            sleep 1
          done
          curl -fsS http://localhost:3000/health
      - run: npx playwright install --with-deps chromium
      - name: Run Playwright (only boots the frontend)
        run: npm run test:e2e -w frontend
      - name: Show backend log on failure
        if: failure()
        run: tail -n 100 /tmp/e2e-logs/backend.log
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results

  coverage-gate:
    name: Coverage gate
    runs-on: ubuntu-latest
    needs: [test-backend-unit, test-frontend]
    steps:
      - uses: actions/checkout@v4
      - run: echo "Coverage thresholds are enforced inside Vitest via per-path thresholds. This job verifies that coverage artifacts are present and become stricter as integration tests land."
      - name: Download backend coverage
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: backend-coverage
          path: backend/coverage
      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: frontend-coverage
          path: frontend/coverage
      - run: ls -la backend/coverage || echo "backend coverage not yet uploaded (no integration tests in Phase 0)"; ls -la frontend/coverage || echo "frontend coverage not yet uploaded"
