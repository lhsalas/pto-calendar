name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test-backend-unit:
    name: Backend unit tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://placeholder@localhost:5432/placeholder?schema=public
      SESSION_SECRET: ci-session-secret-that-is-long-enough-for-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run test -w backend

  test-backend-integration:
    name: Backend integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pto
          POSTGRES_PASSWORD: pto
          POSTGRES_DB: pto_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pto -d pto_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://pto:pto@localhost:5432/pto_test?schema=public
      SESSION_SECRET: ci-session-secret-that-is-long-enough-for-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npx prisma migrate deploy --schema=backend/prisma/schema.prisma
      - name: Install postgresql-client (for backupRestore roundtrip test)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: npm run test:integration:coverage -w backend
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage

  test-frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:coverage -w frontend
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run build

  deployment-config:
    name: Deployment config (static checks)
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Validate Firebase Hosting configuration
        run: |
          node -e "const c=require('./firebase.json'); if (c.hosting?.public !== 'frontend/dist') process.exit(1); if (!c.hosting?.rewrites?.some((r) => r.destination === '/index.html')) process.exit(1)"
      - name: Validate backup lifecycle configuration
        run: |
          node -e "const c=require('./infra/gcp/backup-lifecycle.json'); if (c.rule?.[0]?.condition?.age !== 30) process.exit(1)"
      - name: Validate production deployment guard
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/deploy.yml').read_text()
          required = [
              "actions: read",
              "github.ref == 'refs/heads/master'",
              "github.event.workflow_run.conclusion == 'success'",
              'Verify manual dispatch has successful CI',
              'environment: production',
          ]
          missing = [item for item in required if item not in workflow]
          if missing:
              raise SystemExit(f'Missing production deploy guard: {missing}')
          PY
      - name: Validate privileged OpenCode workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/opencode.yml').read_text()
          required = [
              "github.event.comment.author_association == 'OWNER'",
              "github.event.comment.author_association == 'MEMBER'",
              'environment: opencode',
              'id-token: none',
              'actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803',
              'anomalyco/opencode/github@a3b97d9090ccf4aa9ac32268486283e3131e36b4',
              'ref: ${{ github.event.repository.default_branch }}',
          ]
          missing = [item for item in required if item not in workflow]
          if missing:
              raise SystemExit(f'Missing OpenCode security control: {missing}')
          if '@latest' in workflow or 'id-token: write' in workflow:
              raise SystemExit('OpenCode workflow contains a mutable or excessive privilege')
          PY

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [build]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pto
          POSTGRES_PASSWORD: pto
          POSTGRES_DB: pto_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pto -d pto_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://pto:pto@localhost:5432/pto_test?schema=public
      SESSION_SECRET: ci-session-secret-that-is-long-enough-for-tests
      VITE_API_BASE_URL: http://localhost:3000
      BCRYPT_ROUNDS: '4'
      RATE_LIMIT_MAX: '10000'
      AUTH_RATE_LIMIT_MAX: '1000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npx prisma migrate deploy --schema=backend/prisma/schema.prisma
      - run: PGPASSWORD=pto psql -h localhost -U pto -d pto_test -c "TRUNCATE pto_requests, audit_logs RESTART IDENTITY CASCADE;"
      - run: npm run db:seed -w backend
      - name: Start backend in the background
        run: |
          mkdir -p /tmp/e2e-logs
          nohup npm run dev -w backend > /tmp/e2e-logs/backend.log 2>&1 &
          echo "Backend PID: $!"
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/health >/dev/null 2>&1; then
              echo "Backend is healthy after ${i}s"
              break
            fi
            sleep 1
          done
          curl -fsS http://localhost:3000/health
      - run: npx playwright install --with-deps chromium
      - name: Run Playwright (only boots the frontend)
        run: npm run test:e2e -w frontend
      - name: Show backend log on failure
        if: failure()
        run: tail -n 100 /tmp/e2e-logs/backend.log
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results

  docker-smoke:
    name: Docker smoke (app:up)
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - name: Build and start all-in-one compose
        run: |
          docker compose -f docker-compose.app.yml up --build -d
      - name: Wait for backend /health
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:5173/health >/dev/null 2>&1; then
              echo "Backend healthy after ${i}s"
              break
            fi
            sleep 1
          done
          curl -fsS http://localhost:5173/health || (echo "Backend never became healthy" && docker compose -f docker-compose.app.yml logs backend && exit 1)
      - name: Login as team_lead
        run: |
          rm -f /tmp/smoke-cookies.txt
          curl -fsS -c /tmp/smoke-cookies.txt -X POST http://localhost:5173/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"lead@example.com","password":"lead-dev-password"}'
      - name: Validate auto-seeded holidays (GET /holidays/all)
        run: |
          set -e
          for cc_count in "CO:42" "CL:37" "US:26" "MX:14"; do
            cc="${cc_count%%:*}"
            expected="${cc_count##*:}"
            count=$(curl -fsS -b /tmp/smoke-cookies.txt http://localhost:5173/holidays/all \
              | python3 -c "import json, sys; data=json.load(sys.stdin); print(sum(1 for h in data if h.get('countryCode')=='${cc}'))")
            echo "${cc} holidays: ${count}"
            test "${count}" -eq "${expected}" || (echo "Expected ${expected} ${cc} holidays, got ${count}" && exit 1)
          done
      - name: Validate seed endpoint (idempotent re-seed)
        run: |
          result=$(curl -fsS -b /tmp/smoke-cookies.txt -X POST http://localhost:5173/holidays/seed \
            -H 'Content-Type: application/json' \
            -d '{"countryCode":"CO"}')
          echo "${result}"
          echo "${result}" | python3 -c "import json, sys; d=json.load(sys.stdin); assert d['inserted']==0 and d['skipped']==42 and d['errors']==[], d" \
            || (echo "Expected {inserted:0, skipped:42, errors:[]}" && exit 1)
      - name: Stop and remove containers + volume
        if: always()
        run: docker compose -f docker-compose.app.yml down -v

  coverage-gate:
    name: Coverage gate
    runs-on: ubuntu-latest
    needs: [test-backend-unit, test-backend-integration, test-frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage
      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
      - name: Verify lcov reports exist
        run: |
          test -f backend/coverage/lcov.info
          test -f frontend/coverage/lcov.info
      - name: Post coverage summary comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, re, sys, urllib.request

          def parse_lcov(path):
              totals = {"lines": [0, 0], "branches": [0, 0], "functions": [0, 0]}
              file_re = re.compile(r"^SF:(.+)$")
              lf_re = re.compile(r"^LF:(\d+)$")
              lh_re = re.compile(r"^LH:(\d+)$")
              brf_re = re.compile(r"^BRF:(\d+)$")
              brh_re = re.compile(r"^BRH:(\d+)$")
              fnd_re = re.compile(r"^FNF:(\d+)$")
              fnh_re = re.compile(r"^FNH:(\d+)$")
              with open(path) as f:
                  for line in f:
                      line = line.rstrip()
                      if line.startswith("LF:"):
                          totals["lines"][0] += int(line[3:])
                      elif line.startswith("LH:"):
                          totals["lines"][1] += int(line[3:])
                      elif line.startswith("BRF:"):
                          totals["branches"][0] += int(line[4:])
                      elif line.startswith("BRH:"):
                          totals["branches"][1] += int(line[4:])
                      elif line.startswith("FNF:"):
                          totals["functions"][0] += int(line[4:])
                      elif line.startswith("FNH:"):
                          totals["functions"][1] += int(line[4:])
              return totals

          def fmt(name, hit, total):
              pct = (hit / total * 100) if total else 100.0
              return f"  - {name}: {hit}/{total} ({pct:.2f}%)"

          backend = parse_lcov("backend/coverage/lcov.info")
          frontend = parse_lcov("frontend/coverage/lcov.info")

          lines = []
          lines.append("### Coverage summary")
          lines.append("")
          lines.append("| Workspace | Lines | Branches | Functions |")
          lines.append("|---|---|---|---|")
          for label, data in (("backend", backend), ("frontend", frontend)):
              lp = (data["lines"][1] / data["lines"][0] * 100) if data["lines"][0] else 100
              bp = (data["branches"][1] / data["branches"][0] * 100) if data["branches"][0] else 100
              fp = (data["functions"][1] / data["functions"][0] * 100) if data["functions"][0] else 100
              lines.append(f"| {label} | {lp:.2f}% ({data['lines'][1]}/{data['lines'][0]}) | {bp:.2f}% ({data['branches'][1]}/{data['branches'][0]}) | {fp:.2f}% ({data['functions'][1]}/{data['functions'][0]}) |")
          lines.append("")
          lines.append("Per-path thresholds inside each workspace's `vitest.config.ts` are the real gate. The values above are the totals that flow into `dorny/compare-coverage-action` style comments.")
          body = "\n".join(lines)

          pr = os.environ.get("GITHUB_EVENT_PATH")
          with open(pr) as f:
              import json
              event = json.load(f)
          issue = event.get("issue") or event.get("pull_request")
          if not issue:
              print("No issue/PR found; skipping comment.")
              sys.exit(0)
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/{issue['number']}/comments"
          req = urllib.request.Request(url, data=json.dumps({"body": body}).encode(), method="POST")
          req.add_header("Authorization", f"Bearer {os.environ['GITHUB_TOKEN']}")
          req.add_header("Accept", "application/vnd.github+json")
          req.add_header("Content-Type", "application/json")
          req.add_header("X-GitHub-Api-Version", "2022-11-28")
          with urllib.request.urlopen(req) as resp:
              print(f"Posted comment: HTTP {resp.status}")
          PY
