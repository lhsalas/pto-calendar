name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  GCP_ARTIFACT_REGISTRY_REPOSITORY: ${{ vars.GCP_ARTIFACT_REGISTRY_REPOSITORY }}
  CLOUD_RUN_SERVICE: pto-api
  FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
  FIREBASE_SITE_ORIGIN: ${{ vars.FIREBASE_SITE_ORIGIN }}
  GCP_DIRECT_URL_SECRET: ${{ vars.GCP_DIRECT_URL_SECRET }}
  GCP_DATABASE_URL_SECRET: ${{ vars.GCP_DATABASE_URL_SECRET }}
  GCP_SESSION_SECRET_SECRET: ${{ vars.GCP_SESSION_SECRET_SECRET }}
  GCP_RATE_LIMIT_REDIS_URL_SECRET: ${{ vars.GCP_RATE_LIMIT_REDIS_URL_SECRET }}
  GCP_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}

jobs:
  backend:
    name: Deploy Cloud Run backend
    if: >-
      vars.PRODUCTION_DEPLOY_ENABLED == 'true' &&
      ((github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'master'))
    runs-on: ubuntu-latest
    environment: production
    outputs:
      service_url: ${{ steps.deploy.outputs.service_url }}
    env:
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Verify manual dispatch has successful CI
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/master" ]]; then
            echo "::error::Production deployment can only be dispatched from master."
            exit 1
          fi
          successful_runs="$(gh run list \
            --workflow ci.yml \
            --commit "${GITHUB_SHA}" \
            --event push \
            --status completed \
            --limit 20 \
            --json headBranch,headSha,conclusion \
            --jq '[.[] | select(.headBranch == "master" and .headSha == "'"${GITHUB_SHA}"'" and .conclusion == "success")] | length')"
          if [[ "${successful_runs}" -lt 1 ]]; then
            echo "::error::No successful CI run found for ${GITHUB_SHA} on master."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Authenticate Docker to Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build and push backend image
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_ARTIFACT_REGISTRY_REPOSITORY }}/pto-api:${{ env.IMAGE_TAG }}

      - name: Apply Prisma migrations once
        env:
          IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_ARTIFACT_REGISTRY_REPOSITORY }}/pto-api:${{ env.IMAGE_TAG }}
        run: |
          set -euo pipefail
          set +x
          WORKDIR="$(mktemp -d)"
          chmod 700 "${WORKDIR}"
          trap 'rm -rf "${WORKDIR}"' EXIT
          if ! gcloud secrets versions access latest \
              --project="${GCP_PROJECT_ID}" \
              --secret="${GCP_DIRECT_URL_SECRET}" \
              > "${WORKDIR}/direct-url" 2> "${WORKDIR}/direct-url.err"; then
            echo "::error::Failed to fetch direct URL secret." >&2
            cat "${WORKDIR}/direct-url.err" >&2
            exit 1
          fi
          chmod 600 "${WORKDIR}/direct-url"
          rm -f "${WORKDIR}/direct-url.err"
          DIRECT_URL="$(<"${WORKDIR}/direct-url")"
          printf '::add-mask::%s\n' "${DIRECT_URL}"
          docker run --rm \
            --env "DATABASE_URL=${DIRECT_URL}" \
            "${IMAGE}" \
            npx prisma migrate deploy --schema=backend/prisma/schema.prisma
          unset DIRECT_URL
          rm -rf "${WORKDIR}"

      - name: Deploy Cloud Run revision
        id: deploy
        env:
          IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_ARTIFACT_REGISTRY_REPOSITORY }}/pto-api:${{ env.IMAGE_TAG }}
        run: |
          set -euo pipefail
          gcloud run deploy "${CLOUD_RUN_SERVICE}" \
            --image "${IMAGE}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --platform managed \
            --allow-unauthenticated \
            --service-account "${GCP_RUNTIME_SERVICE_ACCOUNT}" \
            --port 3000 \
            --min-instances 0 \
            --max-instances 3 \
            --update-env-vars "NODE_ENV=production,CORS_ORIGIN=${FIREBASE_SITE_ORIGIN},COOKIE_SECURE=true,COOKIE_SAME_SITE=none,COOKIE_DOMAIN=,TRUST_PROXY_HOPS=1,BCRYPT_ROUNDS=12,LOG_LEVEL=info,RATE_LIMIT_WINDOW_MS=900000,RATE_LIMIT_MAX=100,AUTH_RATE_LIMIT_MAX=5" \
            --update-secrets "SESSION_SECRET=${GCP_SESSION_SECRET_SECRET}:latest,DATABASE_URL=${GCP_DATABASE_URL_SECRET}:latest,RATE_LIMIT_REDIS_URL=${GCP_RATE_LIMIT_REDIS_URL_SECRET}:latest" \
            --quiet
          SERVICE_URL="$(gcloud run services describe "${CLOUD_RUN_SERVICE}" --project "${GCP_PROJECT_ID}" --region "${GCP_REGION}" --format='value(status.url)')"
          echo "service_url=${SERVICE_URL}" >> "${GITHUB_OUTPUT}"
          curl --fail --silent --show-error --max-time 30 "${SERVICE_URL}/health"
          curl --fail --silent --show-error --max-time 30 "${SERVICE_URL}/ready"

  frontend:
    name: Deploy Firebase Hosting frontend
    needs: backend
    if: needs.backend.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend with the Cloud Run API URL
        env:
          VITE_API_BASE_URL: ${{ needs.backend.outputs.service_url }}
        run: npm run build -w frontend

      - name: Render exact Cloud Run origin in Firebase CSP
        env:
          CLOUD_RUN_ORIGIN: ${{ needs.backend.outputs.service_url }}
        run: node bin/render-firebase-config.mjs

      - name: Authenticate to Google Cloud for Firebase CLI
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Deploy Firebase Hosting
        run: |
          set -euo pipefail
          npx --yes firebase-tools@15.26.0 deploy --config firebase.deploy.json --only hosting --project "${FIREBASE_PROJECT_ID}" --non-interactive
          rm -f firebase.deploy.json

      - name: Smoke-test Firebase Hosting SPA + cross-origin /health
        run: |
          set -euo pipefail
          SITE_URL="https://${FIREBASE_PROJECT_ID}.web.app"
          echo "Fetching SPA root from ${SITE_URL}"
          curl --fail --silent --show-error --max-time 30 "${SITE_URL}/" -o /tmp/index.html
          grep -q 'id="root"' /tmp/index.html
          echo "SPA index served; /auth/* and /health are reachable from the SPA origin:"
          curl --fail --silent --show-error --max-time 30 "${SITE_URL}/auth/me" -o /dev/null
          SERVICE_URL="${{ needs.backend.outputs.service_url }}"
          echo "Cross-origin smoke: SPA -> Cloud Run /health"
          curl --fail --silent --show-error --max-time 30 -H "Origin: ${SITE_URL}" "${SERVICE_URL}/health"
