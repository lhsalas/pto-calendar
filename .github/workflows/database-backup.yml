name: Supabase database backup

on:
  schedule:
    - cron: '0 3 * * SAT'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: supabase-database-backup
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  BACKUP_BUCKET: ${{ vars.BACKUP_BUCKET }}
  GCP_BACKUP_DB_URL_SECRET: ${{ vars.GCP_BACKUP_DB_URL_SECRET }}
  GCP_BACKUP_ENCRYPTION_KEY_SECRET: ${{ vars.GCP_BACKUP_ENCRYPTION_KEY_SECRET }}

jobs:
  backup:
    name: Dump and archive Supabase PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_BACKUP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@aa3515eac405eac768fa4a72147c22d88a283c7b # main
        with:
          version: latest

      - name: Dump, encrypt, and upload database
        env:
          SUPABASE_CLI_NO_UPDATE_NOTIFIER: '1'
        run: |
          set -euo pipefail
          set +x
          WORKDIR="$(mktemp -d)"
          chmod 700 "${WORKDIR}"
          trap 'rm -rf "${WORKDIR}"' EXIT
          umask 077

          # Fetch secrets into files; redirect stderr to avoid accidental leaks.
          if ! gcloud secrets versions access latest \
              --project="${GCP_PROJECT_ID}" \
              --secret="${GCP_BACKUP_DB_URL_SECRET}" \
              > "${WORKDIR}/db-url" 2> "${WORKDIR}/db-url.err"; then
            echo "::error::Failed to fetch database URL secret." >&2
            cat "${WORKDIR}/db-url.err" >&2
            exit 1
          fi
          if ! gcloud secrets versions access latest \
              --project="${GCP_PROJECT_ID}" \
              --secret="${GCP_BACKUP_ENCRYPTION_KEY_SECRET}" \
              > "${WORKDIR}/encryption-key" 2> "${WORKDIR}/key.err"; then
            echo "::error::Failed to fetch encryption key secret." >&2
            cat "${WORKDIR}/key.err" >&2
            exit 1
          fi
          chmod 600 "${WORKDIR}/db-url" "${WORKDIR}/encryption-key"
          rm -f "${WORKDIR}/db-url.err" "${WORKDIR}/key.err"

          DB_URL="$(<"${WORKDIR}/db-url")"
          ENCRYPTION_KEY="$(<"${WORKDIR}/encryption-key")"
          # Mask secrets so a later echo / error never reveals them in logs.
          printf '::add-mask::%s\n' "${DB_URL}"
          printf '::add-mask::%s\n' "${ENCRYPTION_KEY}"
          # Supabase direct database endpoints are IPv6-only for this project.
          # GitHub-hosted runners may have no IPv6 route, so fail with an
          # actionable message instead of attempting a doomed dump. The secret
          # must contain the project's IPv4-compatible pooler URL.
          if [[ "${DB_URL}" =~ @db\.[^:/]+\.supabase\.co(:[0-9]+)?/ ]]; then
            echo "::error::GCP_BACKUP_DB_URL_SECRET contains the IPv6-only Supabase direct endpoint. Replace it with the project's IPv4-compatible pooler URL from Supabase Connect." >&2
            exit 1
          fi
          KEY_LENGTH="${#ENCRYPTION_KEY}"
          UNIQUE_CHARS="$(printf '%s' "${ENCRYPTION_KEY}" | LC_ALL=C fold -w1 | sort -u | wc -l)"
          case "${ENCRYPTION_KEY}" in
            replace-me*|change-me*|password*|secret*)
              echo "::error::Encryption key uses a prohibited placeholder prefix." >&2
              exit 1
              ;;
          esac
          if (( KEY_LENGTH < 32 || UNIQUE_CHARS < 16 )); then
            echo "::error::Encryption key is too short or lacks character diversity." >&2
            exit 1
          fi
          unset ENCRYPTION_KEY

          # Dump public schema and public data separately.
          supabase db dump --db-url "${DB_URL}" --schema public --file "${WORKDIR}/schema.sql" > /dev/null
          supabase db dump --db-url "${DB_URL}" --schema public --data-only --use-copy --file "${WORKDIR}/data.sql" > /dev/null
          unset DB_URL

          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          ARCHIVE="${WORKDIR}/pto-${STAMP}.tar.gz"
          ENCRYPTED="${ARCHIVE}.gpg"
          CHECKSUM="${ENCRYPTED}.sha256"
          tar -C "${WORKDIR}" -czf "${ARCHIVE}" schema.sql data.sql
          rm -f "${WORKDIR}/schema.sql" "${WORKDIR}/data.sql"

          # Re-read the key only when needed for symmetric encryption, then mask and unset.
          KEY="$(<"${WORKDIR}/encryption-key")"
          printf '::add-mask::%s\n' "${KEY}"
          printf '%s' "${KEY}" > "${WORKDIR}/passphrase"
          unset KEY
          chmod 600 "${WORKDIR}/passphrase"

          gpg --batch --yes --no-tty --symmetric --cipher-algo AES256 \
            --compress-algo none \
            --passphrase-file "${WORKDIR}/passphrase" \
            --output "${ENCRYPTED}" "${ARCHIVE}"
          rm -f "${WORKDIR}/passphrase" "${WORKDIR}/encryption-key"

          (cd "${WORKDIR}" && sha256sum "$(basename "${ENCRYPTED}")" > "$(basename "${ENCRYPTED}").sha256")
          chmod 644 "${CHECKSUM}"

          gcloud storage cp "${ENCRYPTED}" "${CHECKSUM}" "gs://${BACKUP_BUCKET}/pto/"

          echo "Backup uploaded: gs://${BACKUP_BUCKET}/pto/$(basename "${ENCRYPTED}")"
