# Reviewed dependency update notifications.
#
# The pipeline still enforces the immutability rules: the container images
# stay pinned by digest and the release actions stay pinned to a commit SHA.
# Dependabot only opens a pull request for a review; it never publishes a
# release or changes a pin on its own.
#
# The Node.js runtime stays on the latest LTS line. The patch level is pinned
# in `.nvmrc`, the container base image tag has to match it, and the type
# definitions are held to the same major. Dependabot may propose a rebuild of
# the same tag and a patch or minor update inside the LTS line, but not a
# move to the current release line, which is not an LTS release.
version: 2

updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - area:chore
    groups:
      # Runtime and test tooling move together; the lockfile is shared.
      npm-dependencies:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    ignore:
      # React 19 is a migration, not an update. The React 19 types and the
      # runtime behaviour need source changes, so it is done deliberately.
      # Remove this rule when the migration is planned.
      - dependency-name: react
        update-types:
          - version-update:semver-major
      - dependency-name: react-dom
        update-types:
          - version-update:semver-major
      # typescript-eslint declares a peer range of ">=4.8.4 <6.1.0", so
      # TypeScript 7 is outside the supported range and the type-aware lint
      # rules would run against an unsupported compiler. Remove this rule
      # when typescript-eslint supports TypeScript 7.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # Express 5 changes the route parameter types, so the request handlers
      # need source changes. Remove this rule when the Express 5 migration is
      # planned.
      - dependency-name: express
        update-types:
          - version-update:semver-major
      # Prisma 7 moves the connection URL out of the schema into
      # prisma.config.ts, so the schema, the client and the migration
      # scripts all change. Remove this rule when the Prisma 7 migration is
      # planned.
      - dependency-name: prisma
        update-types:
          - version-update:semver-major
      - dependency-name: '@prisma/client'
        update-types:
          - version-update:semver-major
      # Express 4 requires body-parser 1.x, so the 2.x line belongs to
      # Express 5. The application does not import body-parser itself, it
      # uses express.json(). Remove this rule when Express 5 is planned.
      - dependency-name: body-parser
        update-types:
          - version-update:semver-major
      # ESLint 10 needs eslint-plugin-react-hooks 7, whose recommended
      # config adds the React Compiler rules and the current code does not
      # satisfy them yet. Remove this rule when the React Hooks rules are
      # adopted.
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
      # js-yaml is not imported anywhere in the repository. The version in
      # the tree comes from ESLint's own legacy configuration support.
      - dependency-name: js-yaml
        update-types:
          - version-update:semver-major
      # eslint-plugin-react-hooks 7 adds the React Compiler rules to its
      # recommended config, and the current components do not satisfy them
      # yet. Remove this rule when those rules are adopted.
      - dependency-name: eslint-plugin-react-hooks
        update-types:
          - version-update:semver-major
      # Vitest 5 needs the matching @vitest/coverage-v8 5.x line and changes
      # the assertion type the matcher packages augment. Remove this rule
      # when the test suite is migrated.
      - dependency-name: vitest
        update-types:
          - version-update:semver-major
      - dependency-name: '@vitest/coverage-v8'
        update-types:
          - version-update:semver-major
      # The Node.js type definitions have to match the runtime major, and the
      # runtime stays on the latest LTS line (24.x for now). Dependabot
      # otherwise proposes the current release line, which is not an LTS
      # release. Anything from 25 upwards is ignored; patch and minor updates
      # inside 24.x keep flowing. Remove this rule when the runtime moves to
      # the next LTS line.
      - dependency-name: '@types/node'
        versions:
          - '>=25'
      # rate-limit-redis 6 requires express-rate-limit 8.6 or newer, so the
      # two have to move together. Remove this rule when the store and the
      # limiter are upgraded together.
      - dependency-name: rate-limit-redis
        update-types:
          - version-update:semver-major
      # @eslint/js has to match the ESLint major, and ESLint majors are
      # ignored above. Remove this rule when ESLint 10 is adopted.
      - dependency-name: '@eslint/js'
        update-types:
          - version-update:semver-major
      # MSW 3 removes the onUnhandledRequest setup option the frontend test
      # setup uses. Remove this rule when the test setup is migrated.
      - dependency-name: msw
        update-types:
          - version-update:semver-major

  - package-ecosystem: docker
    directory: '/backend'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - area:infra
    groups:
      backend-base-image:
        patterns:
          - '*'
    ignore:
      # The Node.js runtime stays on the latest LTS line, which is 24.x at the
      # moment. The patch level is pinned in `.nvmrc` and the base image tag
      # has to match it, so Dependabot may only propose a rebuild of the same
      # tag. Moving to another major is a deliberate change, not an update,
      # and it is not an LTS release while the current line is.
      - dependency-name: node
        update-types:
          - version-update:semver-major

  - package-ecosystem: docker
    directory: '/frontend'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - area:infra
    groups:
      frontend-base-image:
        patterns:
          - '*'
    ignore:
      # The Node.js runtime stays on the latest LTS line, which is 24.x at the
      # moment. The patch level is pinned in `.nvmrc` and the base image tag
      # has to match it, so Dependabot may only propose a rebuild of the same
      # tag. Moving to another major is a deliberate change, not an update,
      # and it is not an LTS release while the current line is.
      - dependency-name: node
        update-types:
          - version-update:semver-major

  - package-ecosystem: docker
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - area:infra
    groups:
      compose-base-images:
        patterns:
          - '*'
    ignore:
      # The production base images are pinned by digest and a major version
      # bump changes the runtime contract of the stack, so it is reviewed and
      # merged on purpose rather than proposed automatically.
      - dependency-name: caddy
        update-types:
          - version-update:semver-major
      - dependency-name: nginx
        update-types:
          - version-update:semver-major
      - dependency-name: postgres
        update-types:
          - version-update:semver-major
      # The Node.js runtime stays on the latest LTS line, which is 24.x at the
      # moment. The patch level is pinned in `.nvmrc` and the base image tag
      # has to match it, so Dependabot may only propose a rebuild of the same
      # tag. Moving to another major is a deliberate change, not an update,
      # and it is not an LTS release while the current line is.
      - dependency-name: node
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - area:chore
    groups:
      github-actions:
        patterns:
          - '*'
