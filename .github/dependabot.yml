# Reviewed dependency update notifications.
#
# The pipeline still enforces the immutability rules: the container images
# stay pinned by digest and the release actions stay pinned to a commit SHA.
# Dependabot only opens a pull request for a review; it never publishes a
# release or changes a pin on its own.
version: 2

updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - area:chore
    groups:
      # Runtime and test tooling move together; the lockfile is shared.
      npm-dependencies:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    ignore:
      # React 19 is a migration, not an update. The React 19 types and the
      # runtime behaviour need source changes, so it is done deliberately.
      # Remove this rule when the migration is planned.
      - dependency-name: react
        update-types:
          - version-update:semver-major
      - dependency-name: react-dom
        update-types:
          - version-update:semver-major
      # typescript-eslint declares a peer range of ">=4.8.4 <6.1.0", so
      # TypeScript 7 is outside the supported range and the type-aware lint
      # rules would run against an unsupported compiler. Remove this rule
      # when typescript-eslint supports TypeScript 7.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: docker
    directory: '/backend'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - area:infra
    groups:
      backend-base-image:
        patterns:
          - '*'
    ignore:
      # The Node.js runtime is pinned to a supported 24.x patch level in
      # `.nvmrc` and the base image tag has to match it. A major bump is a
      # deliberate change, not an update.
      - dependency-name: node
        update-types:
          - version-update:semver-major

  - package-ecosystem: docker
    directory: '/frontend'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - area:infra
    groups:
      frontend-base-image:
        patterns:
          - '*'
    ignore:
      # The Node.js runtime is pinned to a supported 24.x patch level in
      # `.nvmrc` and the base image tag has to match it. A major bump is a
      # deliberate change, not an update.
      - dependency-name: node
        update-types:
          - version-update:semver-major

  - package-ecosystem: docker
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - area:infra
    groups:
      compose-base-images:
        patterns:
          - '*'
    ignore:
      # The production base images are pinned by digest and a major version
      # bump changes the runtime contract of the stack, so it is reviewed and
      # merged on purpose rather than proposed automatically.
      - dependency-name: caddy
        update-types:
          - version-update:semver-major
      - dependency-name: nginx
        update-types:
          - version-update:semver-major
      - dependency-name: postgres
        update-types:
          - version-update:semver-major
      - dependency-name: node
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - area:chore
    groups:
      github-actions:
        patterns:
          - '*'
